<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Explore the World</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="auth-card">
            <h2>Explore the World</h2>
            <p style="margin-top: -10px; margin-bottom: 20px; color: #777; font-size: 14px;">Log in to access your saved travel itineraries</p>

            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username"><br>
                <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password"><br>
                <button type="submit">Log In</button>
            </form>

            <div style="margin-top: 15px;">
                <button type="button" id="demoBtn" style="background-color: #4CAF50; margin-top: 5px;">🚀 Quick Demo Login</button>
            </div>

            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            <p style="margin-top: 15px;">
                <a href="homePage.html" style="color: #555; font-size: 14px; text-decoration: none;">
                    🌐 <strong>Explore as Guest &rarr;</strong>
                </a>
            </p>
        </div>

        <script>
            // Ensure demo user exists in localStorage
            if (!localStorage.getItem('user_demo')) {
                localStorage.setItem('user_demo', 'explore123');
            }

            document.getElementById('demoBtn').addEventListener('click', function() {
                sessionStorage.setItem('loggedInUser', 'demo');
                localStorage.setItem('loggedInUser', 'demo');
                alert('Logged in as demo traveler! Welcome to Explore the World.');
                window.location.href = 'homePage.html';
            });

            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value.trim().toLowerCase();
                const password = document.getElementById('loginPassword').value.trim();
        
                const storedPassword = localStorage.getItem('user_' + username);
        
                if (storedPassword && storedPassword === password) {
                    sessionStorage.setItem('loggedInUser', username);
                    localStorage.setItem('loggedInUser', username);
                    alert('Login successful! Welcome back, ' + username.charAt(0).toUpperCase() + username.slice(1) + '.');
                    window.location.href = 'homePage.html';
                } else if (!storedPassword) {
                    alert('Username not found. Please sign up first or use Quick Demo Login!');
                } else {
                    alert('Invalid password! Please try again.');
                }
            });
        </script>
    </body>
</html>
